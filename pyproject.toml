[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "artificial-immune-system"
version = "0.1.0"
description = "A modular agent-based and population-based artificial immune system simulator"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
    { name = "Philip Weber" },
]

dependencies = [
    "numpy>=2.0",
    "PyYAML>=6.0.3",
]

[project.scripts]
ais-simulate = "main:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
lint = [
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "src/ais",
    "src/utils",
    "src/main.py",
]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = [
    "src",
    "tests",
]
